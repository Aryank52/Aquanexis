version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aquanexis-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-aquanexis}
      POSTGRES_USER: ${DB_USER:-aquanexis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aquanexis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aquanexis} -d ${DB_NAME:-aquanexis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquanexis-backend
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-aquanexis}:${DB_PASSWORD:-aquanexis}@postgres:5432/${DB_NAME:-aquanexis}
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=10
      - DEVICE_JWT_SECRET=${DEVICE_JWT_SECRET:-dev-secret-change-in-production-min-32-chars}
      - DEVICE_JWT_ALGORITHM=HS256
      - DEVICE_JWT_EXPIRY_HOURS=24
      - API_KEY_SALT=${API_KEY_SALT:-dev-salt-change-in-production}
      - RATE_LIMIT_REQUESTS=1000
      - RATE_LIMIT_WINDOW_SECONDS=60
      - MODEL_ARTIFACT_DIR=/app/models
      - ML_ENABLED=true
      - NOTIFICATION_PROVIDERS=console
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
      - SAFETY_ENABLED=true
      - SAFETY_ACTION_TIMEOUT_SECONDS=5
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=2).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquanexis-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    container_name: aquanexis-simulator
    environment:
      - BACKEND_URL=http://backend:8000
      - DEVICE_ID=${SIMULATOR_DEVICE_ID:-00000000-0000-0000-0000-000000000001}
      - DEVICE_JWT=${SIMULATOR_DEVICE_JWT:-}
      - SENSOR_INTERVAL_SECONDS=10
      - ANOMALY_PROBABILITY=0.05
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_models:

networks:
  default:
    name: aquanexis-network