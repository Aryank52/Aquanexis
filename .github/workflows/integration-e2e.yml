name: Integration & E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/integration-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/integration-e2e.yml'
  workflow_dispatch:

jobs:
  integration:
    name: Backend Integration & TimescaleDB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: aquanexis
          POSTGRES_PASSWORD: aquanexis
          POSTGRES_DB: aquanexis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquanexis -d aquanexis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Wait for PostgreSQL / TimescaleDB
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U aquanexis -d aquanexis_test && break
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run Alembic migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
          API_KEY_SALT: test-salt-at-least-16-chars
          DEVICE_JWT_SECRET: test-secret-minimum-32-characters-long-for-testing
        run: alembic upgrade head

      - name: Start backend server
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
          DEVICE_JWT_SECRET: test-secret-minimum-32-characters-long-for-testing
          API_KEY_SALT: test-salt-at-least-16-chars
          LOG_FORMAT: console
          LOG_LEVEL: INFO
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for backend health check... ($i/30)"
            sleep 2
          done

      - name: Run backend integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
          API_KEY_SALT: test-salt-at-least-16-chars
          DEVICE_JWT_SECRET: test-secret-minimum-32-characters-long-for-testing
        run: pytest tests/integration -v --tb=short

      - name: Verify frontend build
        working-directory: ./frontend
        run: npm run build

      - name: Stop backend server
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then
            kill $BACKEND_PID || true
          fi

