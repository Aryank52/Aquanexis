name: Docker & Containers

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'docker-compose.yml'
      - 'backend/Dockerfile*'
      - 'frontend/Dockerfile*'
      - 'frontend/nginx.conf'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker-compose.yml'
      - 'backend/Dockerfile*'
      - 'frontend/Dockerfile*'
      - 'frontend/nginx.conf'
      - '.github/workflows/docker.yml'

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [validate-compose]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aquanexis-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [validate-compose]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aquanexis-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-simulator:
    name: Build Simulator Image
    runs-on: ubuntu-latest
    needs: [validate-compose]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build simulator image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.simulator
          push: false
          tags: aquanexis-simulator:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

