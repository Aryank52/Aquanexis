name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: aquanexis
          POSTGRES_PASSWORD: aquanexis
          POSTGRES_DB: aquanexis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aquanexis -d aquanexis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U aquanexis -d aquanexis_test && break
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run backend migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
        run: alembic upgrade head

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
          DEVICE_JWT_SECRET: test-secret-minimum-32-characters-long-for-testing
          API_KEY_SALT: test-salt
          LOG_FORMAT: console
          LOG_LEVEL: INFO
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          # Wait for backend to be ready
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run backend integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
        run: pytest tests/integration -v

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Stop backend
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then
            kill $BACKEND_PID || true
          fi

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: integration
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: aquanexis
          POSTGRES_PASSWORD: aquanexis
          POSTGRES_DB: aquanexis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aquanexis -d aquanexis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U aquanexis -d aquanexis_test && break
            sleep 2
          done

      - name: Run backend migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
        run: alembic upgrade head

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://aquanexis:aquanexis@localhost:5432/aquanexis_test
          APP_ENV: test
          DEVICE_JWT_SECRET: test-secret-minimum-32-characters-long-for-testing
          API_KEY_SALT: test-salt
          LOG_FORMAT: console
          LOG_LEVEL: INFO
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start frontend preview server
        working-directory: ./frontend
        run: |
          npx serve -s dist -l 3000 &
          FRONTEND_PID=$!
          echo "FRONTEND_PID=$FRONTEND_PID" >> $GITHUB_ENV
          sleep 5

      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: npx playwright test --reporter=github

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then kill $BACKEND_PID || true; fi
          if [ -n "$FRONTEND_PID" ]; then kill $FRONTEND_PID || true; fi